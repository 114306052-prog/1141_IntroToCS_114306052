<!DOCTYPE html>
<html>
  <meta charset="UTF-8" />
  <title>114306052 Guessing Game</title>
</html>
<body>
  <h1>114306052 Guessing Game</h1>
  <div id="result"></div>
  <script>
    let answer = Math.floor(Math.random() * 100) + 1;
    let chances = 7;
    let low = 1;
    let high = 100;

    while (chances > 0) {
      let input = window.prompt(
        `請輸入  ${low} 到  ${high} 之間的整數。\n你還有：${chances}次機會。`
      );
      if (input === null || input.trim() === "") {
        alert("輸入不得為空！");
        continue;
      }
      if (isNaN(input)) {
        alert("請輸入有效範圍內的數字！（1到100)");
        continue;
      }

      let guess = Number(input);
      if (guess < low || guess > high) {
        alert("輸入超出目前有效範圍！");
        continue;
      }

      chances--;

      if (guess == answer) {
        alert("答對了！正確答案是：${answer}");
        document.getElementById("result").innerHTML =
          '<img src="correct.jpg" width="300">';
        break;
      } else if (guess < answer) {
        alert("太小了！");
        low = guess + 1;
      } else {
        alert("太大了！");
        high = guess - 1;
      }

      if (chances === 0) {
        alert(`用完所有機會了！正確答案是：${answer}`);
        document.getElementById("result").innerHTML =
          '<img src="wrong.jpg" width="300">';
      }
    }
  </script>
</body>
